[package]
name = "phone-history-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { path = "../ThirdParty/idevice", default-features = false, features = ["ring", "remote_pairing", "rsd", "dvt", "device_info", "tunnel_tcp_stack", "heartbeat"] }
tokio = { version = "1", features = ["full"] }
plist = "1.8"
serde_json = "1"
libc = "0.2"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
